plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rvcs.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.rvcs.android"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }


    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    dexOptions {
        incremental true
        javaMaxHeapSize "4g"
    }

    buildFeatures {
        buildConfig = true
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.livekit.io' }
    }
}

dependencies {
    // Kotlin & Coroutines
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.25"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'

    implementation("io.livekit:livekit-android:2.10.0")
    implementation("io.livekit:livekit-android-camerax:2.10.0")

    implementation("androidx.camera:camera-camera2:1.3.4")
    implementation("androidx.camera:camera-lifecycle:1.3.4")
    implementation("androidx.camera:camera-view:1.3.4")

    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.10.0'

    // Protobuf & Gson
    implementation 'com.google.protobuf:protobuf-javalite:3.21.12'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Desugaring for Java 11+
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.3"
}
